name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的问题**，再说明期望的实现方式。这样即使实现方案被调整，
        原始需求仍然有效。

        以下方向已在规划中，重复提出时会被合并：桌面小组件、资源包增量更新、
        应用内更新日志、新手引导、多校适配。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的使用困境，不要直接给出实现方案
      placeholder: 每次导入课表后都需要手动核对开学日期，容易算错周次。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 可选。若有具体的交互或界面设想，请一并说明
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: 已考虑的替代方案
      description: 可选。说明为什么现有功能无法满足
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 该功能需要联网
        - label: 该功能涉及校内系统登录或私有接口
        - label: 该功能需要新增系统权限
