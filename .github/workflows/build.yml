name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译 Preview 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 platform 36 与 build-tools 36
        # 不用 android-actions/setup-android：它内部会跑 sdkmanager "tools"，
        # 而新版 SDK 仓库已删除 legacy `tools` 包，直接以
        # 「Failed to find package 'tools'」退出（本仓库首次 CI 就栽在这里）。
        #
        # 也不能直接调 sdkmanager：runner 上 cmdline-tools 不在 PATH（换过 JAVA_HOME
        # 之后更明显），第二次 CI 报 `sdkmanager: command not found`。
        # 所以先按 ANDROID_SDK_ROOT 找到它，再写回 GITHUB_ENV 给后续的 Gradle 用。
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDK_ROOT=$SDK"
          echo "SDKMANAGER=$SDKMGR"
          if [ -z "$SDKMGR" ]; then echo "未找到 sdkmanager，runner 镜像可能变了"; exit 1; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: 还原签名密钥
        # 必须有固定密钥。曾用 debug 签名，而 debug keystore 是「首次构建时按机器生成」的，
        # runner 每次都是全新的机器 —— 于是每个版本的证书都不同，新包装不上旧版本
        # （INSTALL_FAILED_UPDATE_INCOMPATIBLE，界面提示「与已安装应用签名不同」）。
        # 缺密钥时宁可直接失败，也不要产出一个盖不上任何既有安装的包。
        env:
          KEYSTORE_BASE64: ${{ secrets.NBULT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NBULT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 secrets.NBULT_KEYSTORE_BASE64，无法用固定密钥签名" >&2
            exit 1
          fi
          store="$RUNNER_TEMP/nbult-preview.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$store"
          echo "NBULT_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "NBULT_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NBULT_KEY_ALIAS=nbult" >> "$GITHUB_ENV"

      - name: 编译
        run: ./gradlew --no-daemon --console=plain :app:assemblePreview

      - name: 校验签名
        # 把证书指纹打进日志。签名一旦退回 debug，这行会立刻显示
        # 「CN=Android Debug」而不是「CN=NBU Assistant Lite」，不必等装机才发现
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/preview/*.apk \
            | grep -E "certificate DN|certificate SHA-256"

      - name: 重命名产物
        # Gradle 只会产出 app-preview.apk，Release 里显示成这个名字没有辨识度。
        # 按 build.gradle.kts 的 versionName 拼成 nbu-assistant-lite-<版本>-Preview.apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          NAME="nbu-assistant-lite-${VERSION}-Preview.apk"
          mkdir -p out
          cp app/build/outputs/apk/preview/*.apk "out/$NAME"
          ls -l out
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-preview
          path: out/*.apk
          if-no-files-found: error

  release:
    name: 打标签时发 Release
    # 只在推 v* 标签时跑；二进制走 Release 分发，仓库里不入库（dist/ 已 ignore）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-preview
          path: apk

      - name: 生成 SHA-256
        run: |
          cd apk
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: 解析发布说明
        # 每个版本手写一份 docs/releases/<tag>.md。不再使用 generate_release_notes，
        # 它只会输出一条提交链接，读者无法据此判断版本内容。
        run: |
          BODY="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$BODY" ]; then
            echo "使用手写发布说明：$BODY"
          else
            BODY="$RUNNER_TEMP/release.md"
            printf '## %s\n\n本版本未提供手写发布说明，逐版本变更见 CHANGELOG.md。\n' \
              "${GITHUB_REF_NAME}" > "$BODY"
            echo "未找到手写发布说明，使用默认正文"
          fi
          echo "BODY_PATH=$BODY" >> "$GITHUB_ENV"

          # 标题去掉前缀 v，并把 -Preview 显示为空格分隔：v0.31.0-Preview → 0.31.0 Preview
          TITLE="${GITHUB_REF_NAME#v}"
          echo "RELEASE_TITLE=${TITLE/-/ }" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      # 应用内更新器读的就是这个文件。
      #
      # 放在 Release 资产里，而不是仓库里的某个文件：仓库文件会随 main 分支变，
      # 但「最新版本」应当以已经发布的那份为准 —— main 上可能刚改完还没出包。
      # `releases/latest/download/manifest.json` 这个路径永远指向最新一版的资产。
      - name: 生成 manifest.json
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          gradle = open('app/build.gradle.kts', encoding='utf-8').read()
          code = int(re.search(r'versionCode = (\d+)', gradle).group(1))
          name = re.search(r'versionName = "([^"]+)"', gradle).group(1)
          apk = glob.glob('apk/*.apk')[0]
          sha = open(glob.glob('apk/*.sha256')[0], encoding='utf-8').read().split()[0]
          tag = os.environ['GITHUB_REF_NAME']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          notes_path = f"docs/releases/{tag}.md"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"{base}/{os.path.basename(apk)}",
              "sha256": sha,
              "notes": open(notes_path, encoding="utf-8").read() if os.path.exists(notes_path) else "",
          }
          with open('apk/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False)[:160])
          PY

      # 先建成 draft 再发布。
      #
      # GitHub 现在把已发布的 release 视为 immutable，不允许再上传资产；
      # 而 action 的内部顺序是「创建 → 上传」，release 一旦立刻发布，
      # 后面的 APK 就一定传不上去（v0.32.2 就是这样失败的）。
      # draft 状态下可以上传，传完再用 gh 发布。
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          draft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body_path: ${{ env.BODY_PATH }}
          files: |
            apk/*.apk
            apk/*.sha256
            apk/manifest.json

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
