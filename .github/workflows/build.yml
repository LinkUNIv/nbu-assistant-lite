name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译 Preview 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 platform 36 与 build-tools 36
        # 不用 android-actions/setup-android：它内部会跑 sdkmanager "tools"，
        # 而新版 SDK 仓库已删除 legacy `tools` 包，直接以
        # 「Failed to find package 'tools'」退出（本仓库首次 CI 就栽在这里）。
        #
        # 也不能直接调 sdkmanager：runner 上 cmdline-tools 不在 PATH（换过 JAVA_HOME
        # 之后更明显），第二次 CI 报 `sdkmanager: command not found`。
        # 所以先按 ANDROID_SDK_ROOT 找到它，再写回 GITHUB_ENV 给后续的 Gradle 用。
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDK_ROOT=$SDK"
          echo "SDKMANAGER=$SDKMGR"
          if [ -z "$SDKMGR" ]; then echo "未找到 sdkmanager，runner 镜像可能变了"; exit 1; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: 编译
        # preview 变体走 debug 签名（见 app/build.gradle.kts），
        # 所以 CI 不需要任何 keystore 密钥
        run: ./gradlew --no-daemon --console=plain :app:assemblePreview

      - name: 重命名产物
        # Gradle 只会产出 app-preview.apk，Release 里显示成这个名字没有辨识度。
        # 按 build.gradle.kts 的 versionName 拼成 nbu-assistant-lite-<版本>-Preview.apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          NAME="nbu-assistant-lite-${VERSION}-Preview.apk"
          mkdir -p out
          cp app/build/outputs/apk/preview/*.apk "out/$NAME"
          ls -l out
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-preview
          path: out/*.apk
          if-no-files-found: error

  release:
    name: 打标签时发 Release
    # 只在推 v* 标签时跑；二进制走 Release 分发，仓库里不入库（dist/ 已 ignore）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: apk-preview
          path: apk

      - name: 生成 SHA-256
        run: |
          cd apk
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: 解析发布说明
        # 每个版本手写一份 docs/releases/<tag>.md。不再使用 generate_release_notes，
        # 它只会输出一条提交链接，读者无法据此判断版本内容。
        run: |
          BODY="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$BODY" ]; then
            echo "使用手写发布说明：$BODY"
          else
            BODY="$RUNNER_TEMP/release.md"
            printf '## %s\n\n本版本未提供手写发布说明，逐版本变更见 CHANGELOG.md。\n' \
              "${GITHUB_REF_NAME}" > "$BODY"
            echo "未找到手写发布说明，使用默认正文"
          fi
          echo "BODY_PATH=$BODY" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.BODY_PATH }}
          files: |
            apk/*.apk
            apk/*.sha256
