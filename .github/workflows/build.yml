name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 测试与构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 platform 36 与 build-tools 36
        # 不用 android-actions/setup-android：它内部会跑 sdkmanager "tools"，
        # 而新版 SDK 仓库已删除 legacy `tools` 包，直接以
        # 「Failed to find package 'tools'」退出（本仓库首次 CI 就栽在这里）。
        #
        # 也不能直接调 sdkmanager：runner 上 cmdline-tools 不在 PATH（换过 JAVA_HOME
        # 之后更明显），第二次 CI 报 `sdkmanager: command not found`。
        # 所以先按 ANDROID_SDK_ROOT 找到它，再写回 GITHUB_ENV 给后续的 Gradle 用。
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDK_ROOT=$SDK"
          echo "SDKMANAGER=$SDKMGR"
          if [ -z "$SDKMGR" ]; then echo "未找到 sdkmanager，runner 镜像可能变了"; exit 1; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: 选择通道并校验标签
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VARIANT=Preview
          SUFFIX=-Preview
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            VARIANT=Debug
            SUFFIX=-Debug
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            case "$GITHUB_REF_NAME" in
              "v$VERSION") VARIANT=Release; SUFFIX=-Release ;;
              "v$VERSION-Preview") ;;
              *) echo '标签与代码版本不匹配' >&2; exit 1 ;;
            esac
            test -f "docs/releases/$GITHUB_REF_NAME.md"
          fi
          echo "BUILD_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "APK_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"

      - name: 还原固定签名
        if: github.event_name != 'pull_request'
        env:
          PREVIEW_KEY: ${{ secrets.NBULT_KEYSTORE_BASE64 }}
          PREVIEW_PASSWORD: ${{ secrets.NBULT_KEYSTORE_PASSWORD }}
          RELEASE_KEY: ${{ secrets.NBULT_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.NBULT_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.NBULT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NBULT_RELEASE_KEY_PASSWORD }}
        run: |
          KEY="$PREVIEW_KEY"
          PASSWORD="$PREVIEW_PASSWORD"
          ALIAS=nbult
          KEY_PASSWORD="$PASSWORD"
          if [ "$BUILD_VARIANT" = Release ]; then
            KEY="$RELEASE_KEY"
            PASSWORD="$RELEASE_PASSWORD"
            ALIAS="${RELEASE_ALIAS:-nbult}"
            KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$PASSWORD}"
          fi
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo '缺少当前通道固定签名 Secrets，拒绝生成无法覆盖升级的包' >&2
            exit 1
          fi
          store="$RUNNER_TEMP/nbult-${BUILD_VARIANT,,}.jks"
          printf '%s' "$KEY" | base64 --decode > "$store"
          chmod 600 "$store"
          echo "NBULT_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "NBULT_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "NBULT_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "NBULT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 测试与编译
        run: ./gradlew --no-daemon --console=plain ":app:test${BUILD_VARIANT}UnitTest" ":app:assemble$BUILD_VARIANT"

      - name: 校验签名
        # 把证书指纹打进日志。签名一旦退回 debug，这行会立刻显示
        # 「CN=Android Debug」而不是「CN=NBU Assistant Lite」，不必等装机才发现
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/${BUILD_VARIANT,,}/*.apk \
            | grep -E "certificate DN|certificate SHA-256"

      - name: 重命名产物
        # Gradle 只会产出 app-preview.apk，Release 里显示成这个名字没有辨识度。
        # 按 build.gradle.kts 的 versionName 拼成 nbu-assistant-lite-<版本>-Preview.apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          NAME="nbu-assistant-lite-${VERSION}${APK_SUFFIX}.apk"
          mkdir -p out
          cp app/build/outputs/apk/${BUILD_VARIANT,,}/*.apk "out/$NAME"
          ls -l out
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 打包源码和混淆映射
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          python3 tools/package-source.py --output "out/nbu-assistant-lite-${VERSION}${APK_SUFFIX}-source.zip"
          mapping="app/build/outputs/mapping/${BUILD_VARIANT,,}/mapping.txt"
          if [ -f "$mapping" ]; then gzip -c "$mapping" > "out/nbu-assistant-lite-${VERSION}${APK_SUFFIX}-mapping.txt.gz"; fi
          node tools/test-browser-observer.cjs
          node tools/test-sign-input.cjs

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: out/*
          if-no-files-found: error

      - name: 保存测试报告与混淆映射
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/reports/tests/
            app/build/outputs/mapping/
          if-no-files-found: ignore

      - name: 清理临时签名
        if: always()
        run: rm -f "$RUNNER_TEMP"/nbult-preview.jks "$RUNNER_TEMP"/nbult-release.jks

  release:
    name: 打标签时发 Release
    # 只在推 v* 标签时跑；二进制走 Release 分发，仓库里不入库（dist/ 已 ignore）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # 同一个 tag 的发布串行化：0.37.1 那次同 tag 出现两条 release（一条已发布空壳、
    # 一条草稿带资产，同一秒），最可能就是两次创建撞在一起。串行能直接消掉这种竞态。
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-package
          path: apk

      - name: 生成 SHA-256
        run: |
          cd apk
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256
          sha256sum *.apk *.zip *.gz > SHA256SUMS.txt

      - name: 解析发布说明
        # 每个版本手写一份 docs/releases/<tag>.md。不再使用 generate_release_notes，
        # 它只会输出一条提交链接，读者无法据此判断版本内容。
        run: |
          BODY="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$BODY" ]; then
            echo "使用手写发布说明：$BODY"
          else
            BODY="$RUNNER_TEMP/release.md"
            printf '## %s\n\n本版本未提供手写发布说明，逐版本变更见 CHANGELOG.md。\n' \
              "${GITHUB_REF_NAME}" > "$BODY"
            echo "未找到手写发布说明，使用默认正文"
          fi
          echo "BODY_PATH=$BODY" >> "$GITHUB_ENV"

          # 标题去掉前缀 v，并把 -Preview 显示为空格分隔：v0.31.0-Preview → 0.31.0 Preview
          TITLE="${GITHUB_REF_NAME#v}"
          echo "RELEASE_TITLE=${TITLE/-/ }" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      # 应用内更新器读的就是这个文件。
      #
      # 放在 Release 资产里，而不是仓库里的某个文件：仓库文件会随 main 分支变，
      # 但「最新版本」应当以已经发布的那份为准 —— main 上可能刚改完还没出包。
      # `releases/latest/download/manifest.json` 这个路径永远指向最新一版的资产。
      - name: 生成 manifest.json
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          gradle = open('app/build.gradle.kts', encoding='utf-8').read()
          code = int(re.search(r'versionCode = (\d+)', gradle).group(1))
          name = re.search(r'versionName = "([^"]+)"', gradle).group(1)
          apk = glob.glob('apk/*.apk')[0]
          sha = open(glob.glob('apk/*.sha256')[0], encoding='utf-8').read().split()[0]
          tag = os.environ['GITHUB_REF_NAME']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          # 清单里的说明直接取自 CHANGELOG 的该版条目 —— 与「更新日志」页同一个源。
          # 以前取 docs/releases/<tag>.md，于是同一版在弹窗和日志页说的是两套话
          # （0.37.15 实测连标题都不同）。同源之后不可能再漂移。
          def changelog_notes(path, tag):
              out, inside = [], False
              for line in open(path, encoding="utf-8").read().splitlines():
                  stripped = line.strip()
                  if stripped.startswith("## v"):
                      if inside:
                          break
                      inside = stripped[3:].strip().split()[0] == tag
                      continue
                  if inside:
                      out.append(line)
              body = "\n".join(out).strip()
              body = re.sub(r"\n?-{3,}\s*$", "", body).strip()
              # 弹窗标题已经写了版本号，这条在应用里是噪音
              body = "\n".join(l for l in body.splitlines() if not l.strip().startswith("- 版本号提升至"))
              return body.strip()

          def section(text):
              out, inside = [], False
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("## "):
                      if inside:
                          break
                      inside = stripped[3:].strip() == "更新内容"
                      continue
                  if inside:
                      out.append(line)
              return out

          def flatten(lines):
              # 只比内容不比折行：CHANGELOG 的续行缩进与正文排版不同，抹掉空白再比
              return "".join("".join(lines).split())

          notes_path = f"docs/releases/{tag}.md"
          doc = open(notes_path, encoding="utf-8").read() if os.path.exists(notes_path) else ""
          notes = changelog_notes("CHANGELOG.md", tag)
          if not notes:
              raise SystemExit(f"CHANGELOG.md 里找不到 {tag} 的条目")
          # GitHub 正文仍用手写的那份（要带「验证与限制」），但「更新内容」必须与 CHANGELOG 一致，
          # 否则网页与弹窗会各自漂移。这里当场比对，不一致就让构建失败。
          if doc and flatten(section(doc)) != flatten(notes.splitlines()):
              import difflib
              diff = "\n".join(difflib.unified_diff(
                  section(doc), notes.splitlines(), "release-doc", "CHANGELOG", lineterm=""))
              raise SystemExit(f"更新内容不一致：{notes_path} 与 CHANGELOG.md\n{diff}")
          manifest = {
              "versionCode": code,
              "versionName": name,
              "applicationId": "app.nbult.lite.preview" if "-Preview" in tag else "app.nbult.lite",
              "channel": "preview" if "-Preview" in tag else "release",
              "apkUrl": f"{base}/{os.path.basename(apk)}",
              "sha256": sha,
              # 应用内用它在下载前给出体积预告（「下载约 23 MB」），不参与校验
              "size": os.path.getsize(apk),
              "notes": notes,
          }
          with open('apk/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False)[:160])
          PY

      # 先建成 draft 再发布。
      #
      # GitHub 现在把已发布的 release 视为 immutable，不允许再上传资产；
      # 而 action 的内部顺序是「创建 → 上传」，release 一旦立刻发布，
      # 后面的 APK 就一定传不上去（v0.32.2 就是这样失败的）。
      # draft 状态下可以上传，传完再用 gh 发布。
      # 已发布的 release 既不能补传资产，也不能删 —— 删了 tag 会被不可变发布机制锁死
      # （0.37.1 就是这么作废的）。所以在创建之前就把重复挡掉。
      - name: 确认该 tag 尚未发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [ "$state" != "true" ]; then
              echo "::error::同 tag 已存在已发布的 release，拒绝重复创建；请改版本号，不要删"
              exit 1
            fi
            echo "已存在草稿 release，将复用并覆盖资产"
          else
            echo "该 tag 尚无 release"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          draft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body_path: ${{ env.BODY_PATH }}
          files: |
            apk/*.apk
            apk/*.sha256
            apk/manifest.json
            apk/*.zip
            apk/*.gz
            apk/SHA256SUMS.txt

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # 应用内「检查更新」读的是这里写出的静态清单，不是 Release API。
      #
      # 原因：校园网下 `github.com` 与 `release-assets.githubusercontent.com` 时通时断，
      # 一次失败要卡 60 秒（15 秒连接超时 × 重试）。静态清单走 raw / jsDelivr —— 资源包
      # 已经在用这两条，实测可用。文件内容就是 manifest.json 加两个字段。
      - name: 同步静态清单到 packs 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          channel=$(python3 -c "import json;print(json.load(open('apk/manifest.json'))['channel'])")
          path="release/latest-${channel}.json"
          python3 - "$path" <<'PY'
          import base64, json, os, subprocess, sys, time
          path = sys.argv[1]
          manifest = json.load(open('apk/manifest.json', encoding='utf-8'))
          manifest['generatedAt'] = int(time.time() * 1000)
          manifest['tag'] = os.environ['GITHUB_REF_NAME']
          body = json.dumps(manifest, ensure_ascii=False, indent=2)
          repo = os.environ['GITHUB_REPOSITORY']
          # 已存在就带上 sha，否则 API 会拒绝更新
          sha = subprocess.run(
              ['gh', 'api', f'repos/{repo}/contents/{path}?ref=packs', '--jq', '.sha'],
              capture_output=True, text=True)
          args = ['gh', 'api', '-X', 'PUT', f'repos/{repo}/contents/{path}',
                  '-f', f'message=chore(packs): 同步 {os.environ["GITHUB_REF_NAME"]} 的静态清单',
                  '-f', f'content={base64.b64encode(body.encode()).decode()}',
                  '-f', 'branch=packs']
          if sha.returncode == 0 and sha.stdout.strip():
              args += ['-f', f'sha={sha.stdout.strip()}']
          subprocess.run(args, check=True, capture_output=True)
          print(f'已写入 {path}（versionCode={manifest["versionCode"]}）')
          PY

      # 半成品比没有更糟：同 tag 多一条空壳会让应用内更新读到缺资产的清单。
      # 这里断言「恰好一条、已发布、资产够数」，不满足就让任务红着，别留给人去发现。
      - name: 发布后自检
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          pick="[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")]"
          dups=$(gh api "$api" --jq "${pick} | length")
          draft=$(gh api "$api" --jq "${pick} | .[0].draft")
          assets=$(gh api "$api" --jq "${pick} | .[0].assets | length")
          echo "同 tag release 数=$dups 草稿=$draft 资产=$assets"
          [ "$dups" = "1" ] || { echo "::error::同 tag 出现了 $dups 条 release"; exit 1; }
          [ "$draft" = "false" ] || { echo "::error::发布后仍是草稿"; exit 1; }
          [ "$assets" -ge 6 ] || { echo "::error::资产数不足：$assets"; exit 1; }
